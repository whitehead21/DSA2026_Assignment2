# Serves the web client and forwards each API path to its service, so the
# browser only ever talks to this one address and the services need no CORS setup.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Looking the services up again every 10 seconds
    # means a rebuilt container, which gets a new IP address, is still found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /customers     { set $service http://customer-service:8081;     proxy_pass $service; }
    location /restaurant    { set $service http://restaurant-service:8082;   proxy_pass $service; }
    location /orders        { set $service http://order-service:8083;        proxy_pass $service; }
    location /payments      { set $service http://payment-service:8084;      proxy_pass $service; }
    location /delivery      { set $service http://delivery-service:8085;     proxy_pass $service; }
    location /notifications { set $service http://notification-service:8086; proxy_pass $service; }
    location /admin         { set $service http://admin-service:8087;        proxy_pass $service; }
}
