networks:
  food-delivery-net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - food-delivery-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - food-delivery-net

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - kafka
    networks:
      - food-delivery-net
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - food-delivery-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - food-delivery-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - ./payment-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - food-delivery-net

  # Ballerina services. Code defaults use localhost (for bal run);
  # BAL_CONFIG_DATA swaps in the container hostnames.

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        mongoHost = "mongo"
    depends_on:
      - kafka
      - mongo
    restart: on-failure
    networks:
      - food-delivery-net

  payment-service:
    build: ./payment-service
    ports:
      - "8084:8084"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        dbHost = "postgres"
    depends_on:
      - kafka
      - postgres
    restart: on-failure
    networks:
      - food-delivery-net

  restaurant-service:
    build: ./restaurant-service
    ports:
      - "8082:8082"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        mongoHost = "mongo"
    depends_on:
      - kafka
      - mongo
    restart: on-failure
    networks:
      - food-delivery-net

  delivery-service:
    build: ./delivery-service
    ports:
      - "8085:8085"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        redisHost = "redis"
    depends_on:
      - kafka
      - redis
    restart: on-failure
    networks:
      - food-delivery-net

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - food-delivery-net

  customer-service:
    build: ./Customer-service
    ports:
      - "8081:8081"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        mongoHost = "mongo"
    depends_on:
      - kafka
      - mongo
    restart: on-failure
    networks:
      - food-delivery-net

  admin-service:
    build: ./admin-service
    ports:
      - "8087:8087"
    environment:
      BAL_CONFIG_DATA: |
        kafkaBootstrap = "kafka:29092"
        mongoHost = "mongo"
    depends_on:
      - kafka
      - mongo
    restart: on-failure
    networks:
      - food-delivery-net
  web-client:
    build: ./web-client
    ports:
      - "8080:80"
    depends_on:
      - customer-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service
      - admin-service
    networks:
      - food-delivery-net
