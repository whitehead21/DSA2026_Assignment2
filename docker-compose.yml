services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  customer_service:
    build: ./backend_services/customer_service
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

  restaurant_service:
    build: ./backend_services/restaurant_service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb

  order_service:
    build: ./backend_services/order_service
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  payment_service:
    build: ./backend_services/payment_service
    ports:
      - "8084:8084"
    depends_on:
      - kafka

  delivery_service:
    build: ./backend_services/delivery_service
    ports:
      - "8085:8085"
    depends_on:
      - kafka

  notification_service:
    build: ./backend_services/notification_service
    depends_on:
      - kafka
      - order_service

  admin_service:
    build: ./backend_services/admin_service
    ports:
      - "8086:8086"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - customer_service
      - order_service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo-data:
